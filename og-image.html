<!doctype html>
<!--
  Generator for og-image.png, the social share card (Open Graph / Twitter /
  LinkedIn). It composes the card from hammhaus.css tokens so it always
  matches the brand. To regenerate: open this file in a browser at exactly
  1200x630 and screenshot the viewport (or use any headless browser).
-->
<html lang="en" data-hh-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Hammhaus share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,700;0,900;1,900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap"
    >
    <link rel="stylesheet" href="./hammhaus.css">
    <style>
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 32px;
        padding: 56px 64px;
        overflow: hidden;
        background:
          linear-gradient(90deg, transparent 0 66%, color-mix(in srgb, var(--hh-blue) 92%, var(--hh-ink)) 66% 100%),
          linear-gradient(90deg, color-mix(in srgb, var(--hh-ink) 4%, transparent) 1px, transparent 1px) 0 0 / 96px 96px,
          linear-gradient(0deg, color-mix(in srgb, var(--hh-ink) 3%, transparent) 1px, transparent 1px) 0 0 / 96px 96px,
          var(--hh-paper);
      }

      .og__brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: var(--hh-font-display);
        font-weight: 900;
        font-size: 30px;
        letter-spacing: var(--hh-tracking-subhead);
      }

      .og__brand .hh-mark {
        transform: scale(1.35);
        transform-origin: left center;
        margin-right: 10px;
      }

      .og__title {
        position: relative;
        z-index: 0; /* contain the em underline's z-index: -1 */
        align-self: center;
        max-width: 720px;
        font-family: var(--hh-font-display);
        font-weight: 900;
        font-size: 128px;
        line-height: 0.86;
        letter-spacing: var(--hh-tracking-hero);
      }

      .og__title em {
        position: relative;
        font-style: normal;
        color: var(--hh-red);
      }

      .og__title i {
        font-style: italic;
        letter-spacing: -0.03em;
      }

      .og__title em::after {
        content: "";
        position: absolute;
        left: 0.02em;
        right: 0.08em;
        bottom: 0.05em;
        height: 0.09em;
        z-index: -1;
        background: var(--hh-yellow);
        transform: rotate(-1.5deg);
        transform-origin: 0 50%;
      }

      .og__meta {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: var(--hh-font-mono);
        font-size: 19px;
        text-transform: uppercase;
        color: var(--hh-ink-2);
      }

      .og__meta .hh-dot { inline-size: 0.75rem; block-size: 0.75rem; }

      /* Right band furniture, echoing the hero. */
      .og__circle {
        position: absolute;
        top: 54px;
        right: 92px;
        width: 210px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--hh-red);
      }

      .og__square {
        position: absolute;
        right: 268px;
        bottom: 88px;
        width: 120px;
        height: 120px;
        background: var(--hh-yellow);
        border: 3px solid var(--hh-black);
        transform: rotate(-9deg);
      }

      .og__ring {
        position: absolute;
        right: 150px;
        bottom: 170px;
        width: 130px;
        height: 130px;
        border: 4px solid var(--hh-cream);
        border-radius: 50%;
      }

      .og__specimen {
        position: absolute;
        right: 96px;
        top: 200px;
        display: grid;
        place-items: center;
        width: 230px;
        height: 230px;
        background: var(--hh-paper-3);
        border: 3px solid var(--hh-black);
        border-radius: var(--hh-radius);
        box-shadow: 10px 12px 0 var(--hh-black);
        transform: rotate(-2deg);
        font-family: var(--hh-font-display);
        font-weight: 900;
        font-size: 130px;
        color: var(--hh-black);
        background-image: linear-gradient(135deg, transparent 0 62%, color-mix(in srgb, var(--hh-yellow) 60%, transparent) 62% 72%, transparent 72%);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og__brand">
        <span class="hh-mark" aria-hidden="true"><span></span><span></span></span>
        Hammhaus
      </div>
      <h1 class="og__title">Hamm <i>follows</i> <em>form.</em></h1>
      <div class="og__meta">
        <span class="hh-dot hh-dot--red"></span><span>1 stylesheet</span>
        <span class="hh-dot hh-dot--blue"></span><span>0 dependencies</span>
        <span class="hh-dot hh-dot--yellow"></span><span>40+ components</span>
        <span class="hh-dot hh-dot--green"></span><span>MIT</span>
      </div>
      <span class="og__circle" aria-hidden="true"></span>
      <span class="og__ring" aria-hidden="true"></span>
      <span class="og__square" aria-hidden="true"></span>
      <span class="og__specimen" aria-hidden="true">Aa</span>
    </div>
  </body>
</html>
